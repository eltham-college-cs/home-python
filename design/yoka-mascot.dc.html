<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yoka the python mascot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}">

</g>

<ellipse cx="104" cy="144" rx="50" ry="14" fill="none" stroke="#0A1B2E" stroke-width="28"></ellipse>

<ellipse cx="104" cy="144" rx="50" ry="14" fill="none" stroke="#163351" stroke-width="8" stroke-dasharray="6 16" stroke-linecap="round"></ellipse>

<path d="M152 142 C 174 118, 158 98, 132 94 C 110 90, 104 80, 112 66" fill="none" stroke="#0A1B2E" stroke-width="28" stroke-linecap="round"></path>
<path d="M152 142 C 174 118, 158 98, 132 94 C 110 90, 104 80, 112 66" fill="none" stroke="#F2B533" stroke-width="20" stroke-linecap="round"></path>
<path d="M152 142 C 174 118, 158 98, 132 94 C 110 90, 104 80, 112 66" fill="none" stroke="#163351" stroke-width="8" stroke-dasharray="6 16" stroke-linecap="round"></path>
<path d="M146 136 C 162 118, 152 104, 132 100" fill="none" stroke="#FFF1C9" stroke-width="5" stroke-linecap="round"></path>

<g>
<animateTransform attributeName="transform" type="rotate" values="{{nod}}" dur="{{nodDur}}" repeatCount="indefinite"></animateTransform>

<circle cx="150" cy="48" r="2" fill="#0A1B2E"></circle>
<polygon points="84,22 112,10 140,22 112,34" fill="#0A1B2E"></polygon>
<path d="M98 28 L 98 34 Q 112 40 126 34 L 126 28" fill="#163351"></path>
<line x1="136" y1="22" x2="142" y2="38" stroke="#0A1B2E" stroke-width="3"></line>
<circle cx="143" cy="40" r="4" fill="#E3C783"></circle>

<g display="{{idleFace}}">

<animate attributeName="ry" values="8;8;1;8" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"></animate>
</ellipse>
<ellipse cx="132" cy="44" rx="8" ry="8" fill="#FFFFFF" stroke="#0A1B2E" stroke-width="2">
<animate attributeName="ry" values="8;8;1;8" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"></animate>
</ellipse>

<animate attributeName="ry" values="4;4;0.5;4" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"></animate>
</ellipse>
<ellipse cx="134" cy="45" rx="4" ry="4" fill="#0A1B2E">

</ellipse>
<path d="M110 62 Q 128 68 146 58" fill="none" stroke="#0A1B2E" stroke-width="3.5" stroke-linecap="round"></path>

<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.64;0.76;0.8" dur="3s" repeatCount="indefinite"></animate>
</path>

<g display="{{happyFace}}">
<path d="M101 48 Q 110 36 119 48" fill="none" stroke="#0A1B2E" stroke-width="4.5" stroke-linecap="round"></path>
<path d="M124 46 Q 133 34 142 46" fill="none" stroke="#0A1B2E" stroke-width="4.5" stroke-linecap="round"></path>
<ellipse cx="100" cy="58" rx="7" ry="4" fill="#F29CA8"></ellipse>

<animate attributeName="opacity" values="1;0;1" dur="0.6s" repeatCount="indefinite"></animate>
</path>
</g>

<g display="{{tryFace}}">
<ellipse cx="110" cy="46" rx="8" ry="8" fill="#FFFFFF" stroke="#0A1B2E" stroke-width="2"></ellipse>
<ellipse cx="132" cy="44" rx="8" ry="8" fill="#FFFFFF" stroke="#0A1B2E" stroke-width="2"></ellipse>

<path d="M114 62 Q 128 66 140 60 Q 144 57 147 54" fill="none" stroke="#0A1B2E" stroke-width="3.5" stroke-linecap="round"></path>
</g>
</g>

<g display="{{sparkles}}">
<path d="M0 -9 L 2.5 -2.5 L 9 0 L 2.5 2.5 L 0 9 L -2.5 2.5 L -9 0 L -2.5 -2.5 Z" transform="translate(30 40)" fill="#F2B533" stroke="#0A1B2E" stroke-width="1.5">
<animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"></animate>
</path>
<path d="M0 -7 L 2 -2 L 7 0 L 2 2 L 0 7 L -2 2 L -7 0 L -2 -2 Z" transform="translate(178 30)" fill="#2F7DD1">
<animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"></animate>
</path>
<path d="M0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" transform="translate(184 110)" fill="#1F9D5C">
<animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.8s" repeatCount="indefinite"></animate>
</path>
<path d="M0 -6 L 2 -2 L 6 0 L 2 2 L 0 6 L -2 2 L -6 0 L -2 -2 Z" transform="translate(56 92)" fill="#D9578A">
<animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.6s" repeatCount="indefinite"></animate>
</path>
</g>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["idle","happy","tryagain"],"default":"idle"},"size":{"editor":"int","min":40,"max":400,"default":220},"$preview":{"width":220,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mood ?? 'idle';
    const s = Number(this.props.size ?? 220);
    const show = (v) => (v ? 'inline' : 'none');
    const bounce = { idle: '0 0;0 -4;0 0', happy: '0 0;0 -12;0 0', tryagain: '0 0;0 -3;0 0' };
    const bounceDur = { idle: '3s', happy: '0.6s', tryagain: '0.9s' };
    const nod = { idle: '0 120 60;0 120 60', happy: '-5 120 60;5 120 60;-5 120 60', tryagain: '0 120 60;7 120 60;0 120 60' };
    const nodDur = { idle: '3s', happy: '0.6s', tryagain: '0.9s' };
    const label = { idle: 'Yoka the python, waiting', happy: 'Yoka the python, celebrating', tryagain: 'Yoka the python, cheering you on to try again' };
    return {
      px: s + 'px',
      label: label[m] ?? label.idle,
      idleFace: show(m === 'idle'),
      happyFace: show(m === 'happy'),
      tryFace: show(m === 'tryagain'),
      restTail: show(m !== 'tryagain'),
      raisedTail: show(m === 'tryagain'),
      sparkles: show(m === 'happy'),
      tailWave: m === 'happy' ? '0 40 172;-14 40 172;0 40 172' : '0 40 172;0 40 172',
      bounce: bounce[m] ?? bounce.idle,
      bounceDur: bounceDur[m] ?? '3s',
      nod: nod[m] ?? nod.idle,
      nodDur: nodDur[m] ?? '3s'
    };
  }
}
</script>
</body>
</html>
